# Greenhouse-gas emission factors per passenger-km (life cycle: operation, energy supply,
# vehicle and infrastructure), Swiss conditions.
#
# Primary source: mobitool-Faktoren v3.0 (mobitool, 2023), Excel database.
# Values below are as reported in Table B.1 of Sticher, Wallimann & Balthasar (2024),
# "How (Not) to Incentivize Sustainable Mobility?", HSLU, arXiv:2409.11142, which cites
# mobitool-Faktoren v3.0. TODO: confirm each row against the mobitool Excel and, if needed,
# pick the more specific row (e.g. regional bus / PostBus instead of generic bus).
factors:
  train:
    value_kg_per_pkm: 0.0070   # "Rapid transit railway, regional train, train": 7.0 g
    source_name: "mobitool-Faktoren v3.0 (via Sticher et al. 2024, Table B.1)"
    source_url: "https://www.mobitool.ch/de/tools/mobitool-faktoren-v3-0-25.html"
    retrieved_on: 2026-09-24
  bus:
    value_kg_per_pkm: 0.1338   # "Bus": 133.8 g - likely an urban-bus average, check vs PostBus
    source_name: "mobitool-Faktoren v3.0 (via Sticher et al. 2024, Table B.1)"
    source_url: "https://www.mobitool.ch/de/tools/mobitool-faktoren-v3-0-25.html"
    retrieved_on: 2026-09-24
  car:
    value_kg_per_pkm: 0.1864   # "Car, other" (fleet average): 186.4 g
    source_name: "mobitool-Faktoren v3.0 (via Sticher et al. 2024, Table B.1)"
    source_url: "https://www.mobitool.ch/de/tools/mobitool-faktoren-v3-0-25.html"
    retrieved_on: 2026-09-24
  # Optional, useful for mountain access (not in the v0.1 SPEC):
  # cable_car:
  #   value_kg_per_pkm: 0.0428  # "Cable car, subway, tramway": 42.8 g
