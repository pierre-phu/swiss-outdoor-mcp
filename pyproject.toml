[project]
name = "swiss-outdoor-mcp"
version = "0.1.0a1"
description = "MCP server for planning Swiss mountain outings by public transport"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Pierre Phu" }]
keywords = ["mcp", "paragliding", "switzerland", "public-transport", "weather"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.2.0",
    # httpx2, not httpx: the MCP SDK depends on it, so this adds no new runtime dependency.
    # See docs/api-notes.md section 1.
    "httpx2>=2.5.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0",
]

[project.scripts]
swiss-outdoor-mcp = "swiss_outdoor_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/pierre-phu/swiss-outdoor-mcp"

[dependency-groups]
dev = [
    "anyio>=4.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swiss_outdoor_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Tests are checked too, but without the strictness that makes fixtures noisy.
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["swiss_outdoor_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
